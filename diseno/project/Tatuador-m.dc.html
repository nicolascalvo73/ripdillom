<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modo tatuador</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./dl.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0}
.tt{position:absolute;mix-blend-mode:multiply;opacity:.9;pointer-events:none}
.tile{width:72px;height:72px;flex:none;background:#F2EBDD;border:2px solid #0D0A0C;padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tile img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.hd{position:absolute;width:14px;height:14px;background:#F7E92B;border:2px solid #0D0A0C}
</style>
</helmet>
<div class="dl grain" style="width:390px;height:844px">
  <div class="neb"></div>
  <div class="abs" style="inset:0;background:rgba(13,10,12,.5)"></div>

  <!-- barra superior -->
  <div class="abs" style="left:16px;right:16px;top:14px;display:flex;align-items:center;justify-content:space-between;z-index:30">
    <button class="xb" aria-label="Salir del modo tatuador"></button>
    <h1 class="fd strap sh" style="font-size:30px;background:#F7E92B;color:#0D0A0C;transform:rotate(-1.5deg)">Tatuador</h1>
    <button class="btn" style="min-height:44px;padding:0 12px;font-size:12px">Guardar</button>
  </div>

  <!-- muñeco + tatuajes -->
  <div class="fsh" style="left:70px;top:664px;width:250px;height:30px"></div>
  <div class="abs" style="left:54px;top:74px;width:282px;height:600px">
    <img class="fig" src="/_blob/eba0fbca276c37c61f69ad67d34ad05e" alt="Muñeco para tatuar" style="display:block;width:100%;height:100%">
    <img class="tt" src="/_blob/052ac288e706d2dd4d3aee3b2e2daf3b" alt="Tatuaje: calavera con muletas" style="left:36%;top:33%;width:26%">
    <img class="tt" src="/_blob/ca6dd496d565a30dff9ddd50d86940b8" alt="Tatuaje: ASAP" style="left:27%;top:49%;width:36%;transform:rotate(-6deg)">
    <img class="tt" src="/_blob/f2da76b08f4d654b6779f3e685ddf9f0" alt="Tatuaje: corona de espinas" style="left:-6%;top:42%;width:26%;transform:rotate(-78deg)">
    <img class="tt" src="/_blob/79344760ae21f0708e52b7db0c5d4e2b" alt="Tatuaje: parca" style="left:80%;top:35%;width:17%">
    <!-- selección sobre la calavera -->
    <div class="abs" style="left:34.5%;top:31.5%;width:29%;height:15.5%;outline:2px dashed #F7E92B">
      <i class="hd" style="left:-8px;top:-8px"></i><i class="hd" style="right:-8px;top:-8px"></i><i class="hd" style="left:-8px;bottom:-8px"></i><i class="hd" style="right:-8px;bottom:-8px;background:#FF2E9A"></i>
      <div class="abs" style="left:50%;top:-26px;width:2px;height:18px;background:#F7E92B"></div>
      <i class="hd" style="left:50%;top:-38px;margin-left:-7px;border-radius:50%;background:#FF2E9A"></i>
    </div>
  </div>

  <!-- herramientas -->
  <div class="abs" style="left:16px;right:16px;top:690px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;z-index:30">
    <button class="btn bn" style="padding:0;font-size:11px">Rotar</button>
    <button class="btn bn" style="padding:0;font-size:11px">Escalar</button>
    <button class="btn bn" style="padding:0;font-size:11px">Espejar</button>
    <button class="btn bk" style="padding:0;font-size:11px">Borrar</button>
  </div>

  <!-- paleta de 7 tatuajes -->
  <div class="abs" style="left:0;right:0;top:744px;height:92px;background:#0D0A0C;border-top:3px solid #F7E92B;z-index:30">
    <div style="display:flex;gap:10px;padding:8px 16px;overflow:hidden">
      <div class="tile" style="border-color:#F7E92B;box-shadow:3px 3px 0 #FF2E9A"><img src="/_blob/052ac288e706d2dd4d3aee3b2e2daf3b" alt="Calavera con muletas"></div>
      <div class="tile"><img src="/_blob/ca6dd496d565a30dff9ddd50d86940b8" alt="ASAP"></div>
      <div class="tile"><img src="/_blob/2d9c508c3145283b035577dcb3517aa8" alt="Dientes"></div>
      <div class="tile"><img src="/_blob/cefb4976d1b9ddfbc639f44e46eeec5f" alt="Cajita de jugo DRIP"></div>
      <div class="tile"><img src="/_blob/f2da76b08f4d654b6779f3e685ddf9f0" alt="Corona de espinas"></div>
      <div class="tile"><img src="/_blob/79344760ae21f0708e52b7db0c5d4e2b" alt="Parca"></div>
      <div class="tile"><img src="/_blob/a675d4db93ff342cc7d55c086b5b1052" alt="Cara"></div>
    </div>
  </div>
  <div class="abs" style="right:16px;top:74px;z-index:30"><span class="chip f-yl" style="font-size:10px">4 / 7 puestos</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
